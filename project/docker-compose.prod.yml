services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN outside Git}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      bot:
        condition: service_healthy
      admin:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  admin:
    image: ${ADMIN_IMAGE:-moroz-i-solntse-admin:local}
    ports: !override
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    environment:
      ADMIN_ROOT_PATH: /admin
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:?set ADMIN_COOKIE_SECURE outside Git}

  bot:
    image: ${BOT_IMAGE:-moroz-i-solntse-bot:local}
    ports: []

  worker:
    image: ${WORKER_IMAGE:-moroz-i-solntse-worker:local}
    environment:
      TECHNICAL_ALERT_CHAT_ID: ${TECHNICAL_ALERT_CHAT_ID:?set TECHNICAL_ALERT_CHAT_ID outside Git}
      BUSINESS_ALERT_CHAT_ID: ${BUSINESS_ALERT_CHAT_ID:-}

  scheduler:
    image: ${SCHEDULER_IMAGE:-moroz-i-solntse-scheduler:local}

  postgres:
    environment:
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY outside Git}
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      - ./ops:/ops:ro
      - pgbackups:/backups/postgres

  backup:
    image: ${BACKUP_IMAGE:-moroz-i-solntse-backup:local}
    build:
      context: .
      dockerfile: ops/Dockerfile.backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY outside Git}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./ops:/ops:ro
      - pgbackups:/backups/postgres
    tmpfs:
      - /tmp:size=${BACKUP_TMPFS_SIZE:-1g},mode=0700,uid=70,gid=70
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/ops/run-backups.sh"]

  ops-check:
    profiles: ["ops"]
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./ops:/workspace/ops:ro
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN outside Git}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL outside Git}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD outside Git}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL outside Git}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER outside Git}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD outside Git}
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL outside Git}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN outside Git}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET outside Git}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME outside Git}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD outside Git}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET outside Git}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:?set ADMIN_COOKIE_SECURE outside Git}
      YCLIENTS_PARTNER_TOKEN: ${YCLIENTS_PARTNER_TOKEN:?set YCLIENTS_PARTNER_TOKEN outside Git}
      YCLIENTS_USER_TOKEN: ${YCLIENTS_USER_TOKEN:?set YCLIENTS_USER_TOKEN outside Git}
      YCLIENTS_COMPANY_ID: ${YCLIENTS_COMPANY_ID:?set YCLIENTS_COMPANY_ID outside Git}
      YCLIENTS_BASE_URL: ${YCLIENTS_BASE_URL:?set YCLIENTS_BASE_URL outside Git}
      YCLIENTS_CATALOG_GROUNDING_ENABLED: ${YCLIENTS_CATALOG_GROUNDING_ENABLED:?set YCLIENTS_CATALOG_GROUNDING_ENABLED outside Git}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY outside Git}
    command: ["python", "/workspace/ops/validate_env.py"]

volumes:
  caddydata:
  caddyconfig:
  pgbackups:
