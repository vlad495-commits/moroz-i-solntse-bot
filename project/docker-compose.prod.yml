services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN outside Git}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      bot:
        condition: service_healthy
      admin:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  admin:
    ports: !override
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"

  bot:
    ports: []

  postgres:
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      - ./ops:/ops:ro
      - pgbackups:/backups/postgres

volumes:
  caddydata:
  caddyconfig:
  pgbackups:
