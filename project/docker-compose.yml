name: moroz-i-solntse-bot

services:
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL outside Git}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL outside Git}
    volumes:
      - .:/workspace:ro
      - ../AGENTS.md:/repo/AGENTS.md:ro
      - ../План реализации.md:/repo/План реализации.md:ro
      - ../docs/superpowers/plans:/repo/docs/superpowers/plans:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    profiles: ["migration"]
    image: "${MIGRATION_IMAGE:-moroz-i-solntse-migrate:local}"
    build:
      context: .
      dockerfile: migrate/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  cutover:
    profiles: ["migration"]
    image: "${MIGRATION_IMAGE:-moroz-i-solntse-migrate:local}"
    build:
      context: .
      dockerfile: migrate/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
    command:
      ["python", "/app/migrations/audit_existing_schema.py", "--config", "/app/alembic.ini"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: "moroz-i-solntse-worker:local"
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL outside Git}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL outside Git}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_REQUEST_TIMEOUT_SEC: ${LLM_REQUEST_TIMEOUT_SEC:-30}
      CONTEXT_MESSAGES_LIMIT: ${CONTEXT_MESSAGES_LIMIT:-20}
      YCLIENTS_PARTNER_TOKEN: ${YCLIENTS_PARTNER_TOKEN:-}
      YCLIENTS_USER_TOKEN: ${YCLIENTS_USER_TOKEN:-}
      YCLIENTS_COMPANY_ID: ${YCLIENTS_COMPANY_ID:-}
      YCLIENTS_BASE_URL: ${YCLIENTS_BASE_URL:-}
      YCLIENTS_TIMEZONE: ${YCLIENTS_TIMEZONE:-}
      YCLIENTS_TIMEOUT_SECONDS: ${YCLIENTS_TIMEOUT_SECONDS:-}
    stop_grace_period: 30s
    volumes:
      - ./llm/prompts:/app/llm/prompts:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'python worker/main.py' && test -f /tmp/worker-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  yclients-smoke:
    profiles: ["yclients-smoke"]
    image: "moroz-i-solntse-worker:local"
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: "no"
    command: ["python", "-m", "moroz.booking.yclients_sandbox_smoke"]
    environment:
      YCLIENTS_PARTNER_TOKEN: ${YCLIENTS_PARTNER_TOKEN:-}
      YCLIENTS_USER_TOKEN: ${YCLIENTS_USER_TOKEN:-}
      YCLIENTS_COMPANY_ID: ${YCLIENTS_COMPANY_ID:-}
      YCLIENTS_BASE_URL: ${YCLIENTS_BASE_URL:-}
      YCLIENTS_TIMEZONE: ${YCLIENTS_TIMEZONE:-}
      YCLIENTS_TIMEOUT_SECONDS: ${YCLIENTS_TIMEOUT_SECONDS:-}
      YCLIENTS_TEST_SERVICE_ID: ${YCLIENTS_TEST_SERVICE_ID:-}
      YCLIENTS_TEST_NAME: ${YCLIENTS_TEST_NAME:-}
      YCLIENTS_TEST_PHONE: ${YCLIENTS_TEST_PHONE:-}
      YCLIENTS_SANDBOX_CONSENT: ${YCLIENTS_SANDBOX_CONSENT:-}

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'python scheduler/main.py' && test -f /tmp/scheduler-heartbeat && python -c \"import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/scheduler-heartbeat') <= 75 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: llm/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL outside Git}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET outside Git}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_REQUEST_TIMEOUT_SEC: ${LLM_REQUEST_TIMEOUT_SEC:-30}
      CONTEXT_MESSAGES_LIMIT: ${CONTEXT_MESSAGES_LIMIT:-20}
      MAX_INPUT_LENGTH: ${MAX_INPUT_LENGTH:-4000}
      INPUT_TOO_LONG_REPLY: ${INPUT_TOO_LONG_REPLY:-Сообщение слишком длинное. Сократите его, пожалуйста (лимит {limit} символов).}
      START_REPLY: ${START_REPLY:-Привет! Я ИИ-ассистент. Задайте свой вопрос текстом, и я постараюсь помочь.}
      NON_TEXT_REPLY: ${NON_TEXT_REPLY:-Я понимаю только текстовые сообщения. Напишите ваш вопрос текстом, пожалуйста.}
      LOG_FILE: ${LOG_FILE:-/app/logs/bot.log}
      LOG_FILE_MAX_BYTES: ${LOG_FILE_MAX_BYTES:-10485760}
      LOG_FILE_BACKUPS: ${LOG_FILE_BACKUPS:-5}
      SHUTDOWN_INFLIGHT_TIMEOUT_SEC: ${SHUTDOWN_INFLIGHT_TIMEOUT_SEC:-15}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-1095}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-me-in-production}
      ADMIN_SESSION_TTL_SEC: ${ADMIN_SESSION_TTL_SEC:-86400}
      BOT_PAUSED_REPLY: ${BOT_PAUSED_REPLY:-Сейчас бот на технической паузе. Мы скоро вернёмся.}
      LOGS_TAIL_LINES: ${LOGS_TAIL_LINES:-300}
      JUDGE_MODEL: ${JUDGE_MODEL:-gpt-4.1-mini}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_PASS_THRESHOLD: ${JUDGE_PASS_THRESHOLD:-0.8}
    stop_grace_period: 30s
    volumes:
      - ./llm/prompts:/app/prompts:rw
      - ./data:/app/data:ro
      - ./logs:/app/logs:rw
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -Eq 'uvicorn webhook:app|python bot.py'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL outside Git}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-me-min-32-chars-please}
      ADMIN_SESSION_TTL_SEC: ${ADMIN_SESSION_TTL_SEC:-86400}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      RESERVE_API_KEY: ${RESERVE_API_KEY:-}
      RESERVE_BASE_URL: ${RESERVE_BASE_URL:-}
      RESERVE_MODEL: ${RESERVE_MODEL:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-gpt-4.1-mini}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_PASS_THRESHOLD: ${JUDGE_PASS_THRESHOLD:-0.8}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      PROMPT_FILE_PATH: ${PROMPT_FILE_PATH:-/app/prompts/system.md}
      LOG_FILE: ${LOG_FILE:-/app/logs/bot.log}
      LOGS_TAIL_LINES: ${LOGS_TAIL_LINES:-300}
    stop_grace_period: 30s
    volumes:
      - ./llm/prompts:/app/prompts:rw
      - ./logs:/app/logs:ro
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD outside Git}
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        exec redis-server --appendonly yes;
      fi'
    volumes:
      - redisdata:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping || redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER outside Git}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB outside Git}
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER outside Git}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD outside Git}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  redisdata:
  pgdata:
  rabbitdata:
