{% extends "base.html" %}
{% block title %}Вход — Admin{% endblock %}
{% block content %}
<div class="login-card">
    <h1>Вход в панель управления</h1>
    {% if error %}<div class="error">Неверный логин или пароль</div>{% endif %}
    <form method="post" action="{{ request.scope.get('root_path', '') }}/login">
        <label>Логин<input type="text" name="username" required autofocus></label>
        <label>Пароль<input type="password" name="password" required></label>
        <label>TOTP-код<input type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code"></label>
        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
